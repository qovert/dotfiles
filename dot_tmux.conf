# -q: powerline isn't installed on every machine, and a failed source would
# be reported at every start
source -q "/usr/share/tmux/powerline.conf"

# Mouse selection and copy-mode copies go to the Wayland clipboard. Ptyxis
# (VTE) ignores the OSC 52 escape tmux would otherwise use, so a drag only
# reached tmux's own buffer. Shift+drag still uses Ptyxis's own selection.
set -g mouse on
if-shell 'command -v wl-copy' "set -s copy-command 'wl-copy'"
