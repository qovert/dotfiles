# Matches waybar (style.css): same font, background, pill and accent colours.
# Colours are RRGGBBAA.
[main]
font=JetBrainsMono Nerd Font:size=11
horizontal-pad=16
vertical-pad=10
inner-pad=6

[colors]
# Bar background, rgba(30, 30, 46, 0.92)
background=1e1e2eeb
text=cdd6f4ff
prompt=89b4faff
input=cdd6f4ff
placeholder=6c7086ff
match=f9e2afff
# Selected row = the module pill colour
selection=313244ff
selection-text=cdd6f4ff
selection-match=f9e2afff
counter=6c7086ff
border=313244ff

[border]
width=1
radius=8
