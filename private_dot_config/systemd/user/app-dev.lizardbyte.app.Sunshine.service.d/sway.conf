# Run Sunshine only in the sway session (capture=wlr can't work under GNOME)
# and bring it back if it dies mid-session, e.g. when its capture output
# disappears. Enabled via sway-session.target.wants, not the packaged
# WantedBy=graphical-session.target, so GNOME logins don't start it.
# sway-systemd imports SWAYSOCK/WAYLAND_DISPLAY before starting the target,
# which remote-on/remote-off need.
[Unit]
PartOf=sway-session.target
After=sway-session.target

[Service]
Restart=always
